<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeamForge</title>
<link rel="stylesheet" href="style.css">
<!-- Pyodide runs the beamforge Python package in the page; app.js fetches the .py files from the repo root,
     so serve the repo root over http (python serve.py) and open /editor/. -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "zipjs": "https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.52/index.min.js"
}}
</script>
</head>
<body>
<!-- Every id below is looked up by app.js ($(id)). -->
<header>
  <div class="brand">BeamForge <span class="tag">prototype</span></div>
  <div class="spaces"></div>
  <div class="files">
    <button id="svjin" title="Pick the folder holding a Standard Vehicle JSON: its .svj.json (or a .zip bundle) and its meshes are found below it">Import SVJ</button>
    <button id="svjinfiles" title="Pick an .svj.json with its mesh files, or a .zip bundle, as files">Files…</button>
    <button id="stepin" title="A STEP skeleton: an assembly of wireframe parts (points and lines), each part a rigid body; built into nodes and beams">Import STEP</button>
    <input type="file" id="stepfile" accept=".step,.stp,.STEP,.STP" hidden>
    <input type="file" id="svjfile" accept=".json,.zip,.glb,.gltf,.bin" multiple hidden>
    <!-- the folder holding the SVJ's meshes, where the browser has no folder picker (findSvjMeshes) -->
    <input type="file" id="svjdir" webkitdirectory multiple hidden>
    <!-- base vehicle: the user's BeamNG content/vehicles folder (or a mod folder), or single vehicle zips -->
    <input type="file" id="bngdir" webkitdirectory multiple hidden>
    <input type="file" id="bngzips" accept=".zip" multiple hidden>
  </div>
</header>

<main>
  <aside id="left">
    <div id="leftveh"></div>   <!-- filled by drawVehList -->
  </aside>

  <section id="viewwrap">
    <div id="view"></div>   <!-- three.js canvas -->
    <div id="toolbar"><div id="hint" class="quiet">Drag to orbit, right-drag to pan, wheel to zoom.</div></div>
    <div id="viewtools">
      <label><input type="checkbox" id="showbeams" checked> Nodes + beams</label>
      <label><input type="checkbox" id="showmesh" checked> Meshes</label>
      <label><input type="checkbox" id="partcolors" checked> Part colours</label>
      <label id="meshtoggle" hidden><input type="checkbox" id="meshes" checked> SVJ meshes</label>
      <label id="hptoggle" hidden><input type="checkbox" id="hps" checked> SVJ hardpoints</label>
      <label id="susptoggle" hidden><input type="checkbox" id="showsusp" checked> SVJ suspension</label>
      <label id="skeltoggle" hidden><input type="checkbox" id="showskel" checked> Skeleton</label>
      <button id="cmpbtn" class="mini" title="Overlap the base vehicle's meshes and the SVJ's: opacity, style, before the fit">Compare</button>
    </div>
    <div id="compare" hidden></div>   <!-- drawCompare: opacity and style of the base and SVJ meshes -->
    <div id="loading">Loading Python engine…</div>   <!-- removed by boot() once Python is ready -->
  </section>

  <aside id="right">
    <div id="inspector"></div>   <!-- drawInspector: vehicle parts and tuning, then the SVJ panel -->
  </aside>
</main>

<!-- Footer: key numbers (drawBudget), messages (showIssues) and timings (drawTiming). -->
<footer>
  <div id="budget"></div>
  <div id="issues"></div>
  <div id="timing" class="quiet"></div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
